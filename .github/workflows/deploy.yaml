name: 🚀 Deploy Symfony (Fast)

on:
  push:
    branches:
      - migration-symfony

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, zip, gd

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: 🎼 Composer install (prod)
        run: |
          cd symfony
          composer install --no-dev --optimize-autoloader --classmap-authoritative --no-interaction

      - name: 📤 Deploy via FTP (fast)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: scoutmada2025.mg
          username: checkin@scoutmada2025.mg
          password: scoutmada2025

          protocol: ftp
          port: 21

          local-dir: ./symfony/
          server-dir: /public_html/symfony/

          timeout: 600000
          dangerous-clean-slate: false
          log-level: minimal
          security: loose

          # KEY FOR FAST DEPLOY
          state-name: .ftp-deploy-sync-state.json

          exclude: |
            **/.git**
            **/.github/**
            **/node_modules/**
            **/var/**
            .env.local*
            *.log
            # après le premier déploiement
            # **/vendor/**
