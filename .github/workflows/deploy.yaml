name: 🚀 Deploy Symfony via FTP

on:
  push:
    branches:
      - migration-symfony  # branche qui déclenche le déploiement

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupérer le code du dépôt
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Installer PHP et Composer sur le runner
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # correspond à ta version de Symfony
          extensions: mbstring, intl, pdo_mysql

      # 3️⃣ Installer les dépendances Composer dans le dossier symfony
      - name: Install Composer dependencies
        run: |
          cd symfony
          composer install --no-dev --optimize-autoloader

      # 4️⃣ Déployer tous les fichiers (y compris vendor) via FTP
      - name: 📤 FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: scoutmada2025.mg
          username: checkin@scoutmada2025.mg
          password: scoutmada2025
          server-dir: /public_html/symfony/
          local-dir: ./symfony/
          exclude: |
            .git*
            tests/
            .github/
            node_modules/
