name: Deploy Symfony App via FTP

on:
  push:
    branches:
      - migration-symfony   # déclenche sur un push sur migration-symfony

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Installation PHP + Composer
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          tools: composer
          extensions: mbstring, intl, pdo_mysql

      # 3. Installer les dépendances
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      # 4. Compiler les assets (si Webpack Encore)
      - name: Build Frontend assets
        run: |
          if [ -f "package.json" ]; then
            npm install
            npm run build
          fi

      # 5. Déploiement FTP
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: scoutmada2025.mg
          username: checkin@scoutmada2025.mg
          password: scoutmada2025
          server-dir: /public_html/
          local-dir: ./symfony/     # mets ici TON dossier sur le serveur
          dangerous-clean-slate: false    # évite de supprimer tout le site
