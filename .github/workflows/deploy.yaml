name: 🚀 Deploy Symfony via FTP

on:
  push:
    branches:
      - migration-symfony

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v3

      # ⛔ Ignore vendor et node_modules
      - name: Cleanup unnecessary files
        run: |
          rm -rf symfony/vendor
          rm -rf symfony/node_modules

      # 📤 FTP Upload (sans vendor)
      - name: 📤 FTP Upload (Safe Mode)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: scoutmada2025.mg
          username: checkin@scoutmada2025.mg
          password: scoutmada2025
          server-dir: /public_html/symfony/
          local-dir: ./symfony/
          exclude: |
            .git*
            .github/
            vendor/
            node_modules/

      # 📦 Installer vendor directement sur le serveur
      - name: Run composer install on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: scoutmada2025.mg
          username: checkin@scoutmada2025.mg
          password: scoutmada2025
          script: |
            cd /home/scoutmada2025/public_html/symfony
            composer install --no-dev --optimize-autoloader




