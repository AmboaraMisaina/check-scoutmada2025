name: 🚀 Deploy Symfony via FTP

on:
  push:
    branches:
      - migration-symfony

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up PHP
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql

      # 3️⃣ Install Composer dependencies
      - name: Install Composer dependencies
        run: |
          cd symfony
          composer install --no-dev --optimize-autoloader

      # 4️⃣ Deploy project excluding vendor
      - name: FTP Deploy (without vendor)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: scoutmada2025.mg
          username: checkin@scoutmada2025.mg
          password: scoutmada2025
          server-dir: /public_html/symfony/
          local-dir: ./symfony/
          exclude: |
            .git*
            tests/
            .github/
            node_modules/
            vendor/

      # 5️⃣ Deploy vendor separately
      - name: FTP Deploy vendor only
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: scoutmada2025.mg
          username: checkin@scoutmada2025.mg
          password: scoutmada2025
          server-dir: /public_html/symfony/vendor/
          local-dir: ./symfony/vendor/
