name: 🚀 Deploy Symfony (No SSH)

on:
  push:
    branches:
      - migration-symfony

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, zip, gd

      - name: 🎼 Composer install (prod)
        run: |
          cd symfony
          composer install --no-dev --optimize-autoloader --classmap-authoritative --no-interaction

      - name: 📤 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: scoutmada2025.mg
          username: checkin@scoutmada2025.mg   # même user que FTP très souvent
          password: scoutmada2025

          protocol: ftps
          port: 21

          local-dir: ./symfony/
          server-dir: /public_html/symfony/

          timeout: 600000
          dangerous-clean-slate: false
          log-level: verbose

          exclude: |
            **/.git**
            **/.github/**
            **/node_modules/**
            **/var/**
            .env.local*
            *.log
